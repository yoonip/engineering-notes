<text x="255.0" y="337" font-size="25" font-weight="600" text-anchor="middle" fill="#193249">모델·물리 뷰</text>
<text x="255.0" y="370" font-size="19" font-weight="400" text-anchor="middle" fill="#536575">동작·SPICE/CDL·LEF·GDS</text>
