<text x="690.0" y="167" font-size="25" font-weight="600" text-anchor="middle" fill="#193249">RTL 디지털 구현</text>
<text x="690.0" y="200" font-size="19" font-weight="400" text-anchor="middle" fill="#536575">합성·배치배선·타이밍·검사</text>
<rect x="930" y="130" width="390" height="118" rx="13" fill="#f5f1e9" stroke="#9aacbf" stroke-width="2"/>
<text x="1125.0" y="167" font-size="25" font-weight="600" text-anchor="middle" fill="#193249">메모리 매크로</text>
<text x="1125.0" y="200" font-size="19" font-weight="400" text-anchor="middle" fill="#536575">셀·주변회로·물리 구현·특성</text>
