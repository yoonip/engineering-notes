<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1010" viewBox="0 0 1380 1010" role="img" aria-labelledby="title desc">
<title id="title">아날로그·디지털·메모리의 칩 최상위 인계</title><desc id="desc">풀커스텀 아날로그 매크로, RTL로 구현한 디지털 블록, SRAM 매크로가 각자의 논리·물리·전기 모델을 전달합니다. 최상위 칩에서 전원·신호·패드와 연결하고 칩 전체 검증 후 최종 파일을 인계합니다.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#42556b" stroke-width="1.6"/></marker></defs>
<rect width="1380" height="1010" fill="white"/><g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#193249">
<text x="60" y="58" font-size="31" font-weight="600" text-anchor="start" fill="#193249">블록별 설계 결과를 하나의 칩으로 연결합니다.</text>
<rect x="60" y="130" width="390" height="118" rx="13" fill="#eef3fa" stroke="#9aacbf" stroke-width="2"/>
<text x="255.0" y="167" font-size="25" font-weight="600" text-anchor="middle" fill="#193249">풀커스텀 아날로그</text>
<text x="255.0" y="200" font-size="19" font-weight="400" text-anchor="middle" fill="#536575">회로·배치·배선·추출 후 성능</text>
