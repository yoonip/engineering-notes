<text x="690.0" y="867" font-size="25" font-weight="600" text-anchor="middle" fill="#193249">동일한 최종 설계 판본으로 인계</text>
<text x="690.0" y="900" font-size="19" font-weight="400" text-anchor="middle" fill="#536575">GDSII/OASIS·기준 회로·검증 보고서·pad/bump·조립·검사 자료</text>
<text x="690" y="982" font-size="19" font-weight="400" text-anchor="middle" fill="#536575">하나의 매크로를 서로 다른 뷰로 읽습니다. 파일의 이름·핀·판본과 검증 범위를 맞춥니다.</text>
