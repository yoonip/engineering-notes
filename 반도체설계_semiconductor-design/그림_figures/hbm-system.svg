<title id="title">HBM 내부의 수직 적층과 호스트의 인터포저 연결</title><desc id="desc">직접 작성한 인터포저 기반 HBM 조립체의 단면 개념도입니다. 왼쪽 DRAM 다이와 베이스 다이는 수직 연결되고 오른쪽 호스트와는 인터포저를 통해 연결됩니다. 실제 비율이나 특정 제품의 설계도는 아닙니다.</desc>
