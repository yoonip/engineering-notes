<text x="355.0" y="704" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">DRC·LVS</text>
<text x="355.0" y="730" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">공정 규칙과 의도한 회로 연결 확인</text>
<path d="M355,748 L355,768" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="85" y="776" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="355.0" y="806" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">PEX → 회로 성능 재검증</text>
<text x="355.0" y="832" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">기생 RC를 포함해 동작 조건 확인</text>
<rect x="755" y="368" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="1025.0" y="398" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">RTL과 테스트벤치</text>
<text x="1025.0" y="424" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">Verilog·SystemVerilog / 기능·프로토콜</text>
