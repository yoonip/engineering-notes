<text x="355.0" y="628" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">소자 위치·배선·매칭·전원</text>
<path d="M355,646 L355,666" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
