<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1240" viewBox="0 0 1380 1240" role="img" aria-labelledby="title desc">
<title id="title">회로 설계와 RTL 설계의 흐름</title><desc id="desc">직접 작성한 설계 흐름 개념도입니다. 명세와 공정 자료에서 두 설계 흐름으로 나뉘고, 검증한 다이별 데이터와 멀티다이 설계로 이어집니다. 단계마다 설계 수정과 재검증이 반복됩니다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#42556b" stroke-width="1.6"/></marker></defs>
<rect width="1380" height="1240" fill="#ffffff"/>
<g font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif" fill="#193249">
<text x="60" y="52" font-size="32" text-anchor="start" font-weight="600" fill="#193249">회로·RTL에서 다이 데이터와 3D 집적까지</text>
<rect x="300" y="86" width="780" height="72" rx="12" fill="#eef3f8" stroke="#becbd7" stroke-width="2"/>
<text x="690.0" y="116" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">명세·구조·검증 계획</text>
<text x="690.0" y="142" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">기능·용량·성능·전력·검사·사용 조건</text>
<path d="M690,160 L690,183" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="60" y="194" width="1260" height="72" rx="12" fill="#edf5f3" stroke="#becbd7" stroke-width="2"/>
<text x="690.0" y="224" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">공정과 환경</text>
<text x="690.0" y="250" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">Linux·도구·라이선스 / PDK·소자 모델·규칙·셀·메모리 IP</text>
<path d="M355,266 L355,304" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M1025,266 L1025,304" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="60" y="317" width="590" height="575" rx="18" fill="#f3f7fc" stroke="#9aadc5" stroke-width="2"/>
<rect x="730" y="317" width="590" height="575" rx="18" fill="#f0f8f6" stroke="#96b8ad" stroke-width="2"/>
<text x="355" y="350" font-size="26" text-anchor="middle" font-weight="600" fill="#193249">트랜지스터 회로 설계</text>
<text x="1025" y="350" font-size="26" text-anchor="middle" font-weight="600" fill="#193249">디지털 RTL 설계</text>
<rect x="85" y="368" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="355.0" y="398" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">소자와 연결을 설계</text>
<text x="355.0" y="424" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">SRAM·DRAM 주변회로·아날로그 블록</text>
<path d="M355,442 L355,462" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="85" y="470" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="355.0" y="500" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">추출 전 회로 시뮬레이션</text>
<text x="355.0" y="526" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">Spectre 등 / 전압·전류·잡음·편차</text>
<path d="M355,544 L355,564" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="85" y="572" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
