<rect x="755" y="470" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="1025.0" y="500" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">합성·제약·검사 구조</text>
<text x="1025.0" y="526" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">표준셀·메모리 매핑 / STA·DFT</text>
<path d="M1025,544 L1025,564" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="755" y="572" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="1025.0" y="602" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">배치·클록·배선</text>
<text x="1025.0" y="628" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">floorplan·PDN·placement·CTS·routing</text>
<path d="M1025,646 L1025,666" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="755" y="674" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="1025.0" y="704" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">물리 검증과 기생 추출</text>
<text x="1025.0" y="730" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">DRC·LVS·PEX / 최종 배선 기준</text>
<path d="M1025,748 L1025,768" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="755" y="776" width="540" height="72" rx="12" fill="#ffffff" stroke="#becbd7" stroke-width="2"/>
<text x="1025.0" y="806" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">추출 후 분석</text>
<text x="1025.0" y="832" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">STA·전력·IR drop·EM 등</text>
<path d="M355,892 L355,923" fill="none" stroke="#42556b" stroke-width="2.4"/>
<path d="M1025,892 L1025,923" fill="none" stroke="#42556b" stroke-width="2.4"/>
<path d="M355,923 L1025,923" fill="none" stroke="#42556b" stroke-width="2.4"/>
<path d="M690,923 L690,944" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="260" y="952" width="860" height="78" rx="12" fill="#eef3f8" stroke="#becbd7" stroke-width="2"/>
<text x="690.0" y="982" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">검증한 다이별 설계 데이터</text>
<text x="690.0" y="1008" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">GDSII/OASIS + 넷리스트·모델·제약·검증 보고서</text>
<path d="M690,1032 L690,1067" fill="none" stroke="#42556b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="140" y="1078" width="1100" height="84" rx="12" fill="#f7f3eb" stroke="#becbd7" stroke-width="2"/>
<text x="690.0" y="1108" font-size="23" text-anchor="middle" font-weight="600" fill="#193249">멀티다이·HBM·패키지 설계와 검증</text>
<text x="690.0" y="1134" font-size="18" text-anchor="middle" font-weight="400" fill="#4c6174">다이 배치·범프/TSV·연결·전력·열·응력·적층 검사 → 제조·조립 인계</text>
<text x="690" y="1203" font-size="20" text-anchor="middle" font-weight="400" fill="#536575">멀티다이 설계는 명세 단계부터 병행합니다. 화살표는 데이터 연결을 나타냅니다.</text>
