<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">CPU 명령 실행과 캐시·DRAM의 연결</title><desc id="desc">Zen 5의 공개 구조를 바탕으로 분기 예측, 명령 가져오기, 디코드와 이름 바꾸기, 발행, 실행기, 로드스토어와 캐시 계층을 정리한 기능 흐름도입니다. 실제 다이 배치나 모든 내부 연결을 나타내지 않습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526b82"/></marker></defs>
<g font-family="Noto Sans CJK KR,Malgun Gothic,Arial,sans-serif"><rect width="1400" height="880" fill="white"/><text x="48" y="57" font-size="34" font-weight="700" fill="#1b2838" text-anchor="start">CPU의 명령 실행 경로와 메모리 계층</text><text x="48" y="94" font-size="21" font-weight="400" fill="#536878" text-anchor="start">AMD Zen 5 공개 구조를 읽기 위한 요약</text><rect x="50" y="136" width="400" height="146" rx="8" fill="#f4f7fa" stroke="#bbc8d4" stroke-width="2"/><text x="72" y="181" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">분기 예측·명령 가져오기</text><text x="72" y="233" font-size="20" font-weight="400" fill="#1b2838" text-anchor="start">다음에 실행할 명령을 준비합니다.</text><rect x="500" y="136" width="400" height="146" rx="8" fill="#f4f7fa" stroke="#bbc8d4" stroke-width="2"/><text x="522" y="181" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">디코드·이름 바꾸기</text><text x="522" y="233" font-size="20" font-weight="400" fill="#1b2838" text-anchor="start">명령을 내부 작업으로 바꿉니다.</text><rect x="950" y="136" width="400" height="146" rx="8" fill="#f4f7fa" stroke="#bbc8d4" stroke-width="2"/><text x="972" y="181" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">스케줄링·발행</text><text x="972" y="233" font-size="20" font-weight="400" fill="#1b2838" text-anchor="start">입력과 실행기가 준비되면 보냅니다.</text><path d="M452,210 L490,210" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><path d="M902,210 L940,210" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="370" width="360" height="138" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="102" y="416" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">정수 실행</text><text x="102" y="466" font-size="20" font-weight="400" fill="#1b2838" text-anchor="start">주소·정수·분기 관련 연산</text><rect x="520" y="370" width="360" height="138" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="542" y="416" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">부동소수점·벡터 실행</text><text x="542" y="466" font-size="20" font-weight="400" fill="#1b2838" text-anchor="start">실수와 벡터 데이터 연산</text><rect x="960" y="370" width="360" height="138" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="982" y="416" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">로드·스토어</text><text x="982" y="466" font-size="20" font-weight="400" fill="#1b2838" text-anchor="start">메모리 값을 읽고 씁니다.</text><path d="M1150,284 L1150,323 L260,323 L260,360 M700,323 L700,360 M1140,323 L1140,360" fill="none" stroke="#526b82" stroke-width="3"/><path d="M260,338 L260,360" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><path d="M700,338 L700,360" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><path d="M1140,338 L1140,360" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="614" width="1260" height="150" rx="8" fill="#f7f8fa" stroke="#bbc8d4" stroke-width="2"/><text x="94" y="648" font-size="24" font-weight="700" fill="#1b2838" text-anchor="start">명령·데이터의 메모리 계층</text><text x="100" y="691" font-size="21" font-weight="600" fill="#1b2838" text-anchor="start">L1I · 명령</text><text x="100" y="734" font-size="21" font-weight="600" fill="#1b2838" text-anchor="start">L1D · 데이터</text><text x="440" y="710" font-size="23" font-weight="600" fill="#1b2838" text-anchor="start">코어별 L2</text><text x="760" y="710" font-size="23" font-weight="600" fill="#1b2838" text-anchor="start">공유 L3</text><text x="1060" y="710" font-size="23" font-weight="600" fill="#1b2838" text-anchor="start">외부 DRAM</text><path d="M250,683 L340,683 L340,701 L417,701" fill="none" stroke="#526b82" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M250,726 L340,726 L340,712 L417,712" fill="none" stroke="#526b82" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M50,210 L24,210 L24,682 L88,682" fill="none" stroke="#526b82" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M1140,520 L1140,558 L48,558 L48,725 L88,725" fill="none" stroke="#526b82" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="650" y="548" font-size="18" font-weight="400" fill="#536878" text-anchor="start">로드·스토어의 데이터 요청과 응답</text><path d="M595,701 L720,701" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M885,701 L1020,701" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="50" y="794" font-size="22" font-weight="400" fill="#1b2838" text-anchor="start">실행 순서와 완료 순서는 같지 않을 수 있습니다. 결과는 아키텍처가 정한 순서로 확정합니다.</text><text x="50" y="846" font-size="18" font-weight="400" fill="#536878" text-anchor="start">근거: AMD Next Generation “Zen 5” Core, Hot Chips 2024, pp. 4–5 · 내부 버퍼·연결은 학습용으로 생략했습니다.</text></g></svg>
