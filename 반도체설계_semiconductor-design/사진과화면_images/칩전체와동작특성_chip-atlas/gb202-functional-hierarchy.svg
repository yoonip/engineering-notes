<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
<title id="title">GB202 GPU의 기능 계층과 메모리 경로</title><desc id="desc">전체 GB202의 12개 GPC, 96개 TPC, 192개 SM과 L1 및 공유 메모리, L2, 메모리 제어기, GDDR7 연결을 요약합니다. 실제 물리 floorplan이 아닙니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#526b82"/></marker></defs>
<g font-family="Noto Sans CJK KR,Malgun Gothic,Arial,sans-serif"><rect width="1400" height="880" fill="white"/><text x="48" y="57" font-size="34" font-weight="700" fill="#1b2838" text-anchor="start">GB202 GPU의 기능 계층</text><text x="48" y="94" font-size="21" font-weight="400" fill="#536878" text-anchor="start">NVIDIA RTX Blackwell · 전체 칩 구성 기준</text><rect x="50" y="135" width="380" height="242" rx="8" fill="#f4f7fa" stroke="#bbc8d4" stroke-width="2"/><text x="74" y="182" font-size="30" font-weight="700" fill="#1b2838" text-anchor="start">GPC × 12</text><text x="74" y="220" font-size="19" font-weight="400" fill="#536878" text-anchor="start">Graphics Processing Cluster</text><text x="74" y="280" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">GPC당 TPC 8개</text><text x="74" y="318" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">GPC당 SM 16개</text><rect x="510" y="135" width="380" height="242" rx="8" fill="#f4f7fa" stroke="#bbc8d4" stroke-width="2"/><text x="534" y="182" font-size="30" font-weight="700" fill="#1b2838" text-anchor="start">TPC × 96</text><text x="534" y="220" font-size="19" font-weight="400" fill="#536878" text-anchor="start">Texture Processing Cluster</text><text x="534" y="280" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">TPC당 SM 2개</text><text x="534" y="318" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">그래픽 처리 단위를 묶는 계층</text><rect x="970" y="135" width="380" height="242" rx="8" fill="#f4f7fa" stroke="#bbc8d4" stroke-width="2"/><text x="994" y="182" font-size="30" font-weight="700" fill="#1b2838" text-anchor="start">SM × 192</text><text x="994" y="220" font-size="19" font-weight="400" fill="#536878" text-anchor="start">Streaming Multiprocessor</text><text x="994" y="280" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">SM당 CUDA 코어 128개</text><text x="994" y="318" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">RT 코어 1개 · Tensor 코어 4개</text><path d="M432,255 L500,255" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><path d="M892,255 L960,255" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="438" font-size="27" font-weight="700" fill="#1b2838" text-anchor="start">연산기에서 외부 메모리까지</text><rect x="50" y="474" width="280" height="154" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="70" y="520" font-size="21" font-weight="700" fill="#1b2838" text-anchor="start">SM별 L1 / 공유 메모리</text><text x="70" y="561" font-size="18" font-weight="400" fill="#1b2838" text-anchor="start">실행 중 가까이 쓰는 데이터</text><rect x="390" y="474" width="280" height="154" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="410" y="520" font-size="21" font-weight="700" fill="#1b2838" text-anchor="start">L2 캐시 128 MB</text><text x="410" y="561" font-size="18" font-weight="400" fill="#1b2838" text-anchor="start">전체 GB202 구성의 값</text><rect x="730" y="474" width="280" height="154" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="750" y="520" font-size="21" font-weight="700" fill="#1b2838" text-anchor="start">메모리 제어기</text><text x="750" y="561" font-size="18" font-weight="400" fill="#1b2838" text-anchor="start">16 × 32 bit = 512 bit</text><rect x="1070" y="474" width="280" height="154" rx="8" fill="#edf4f8" stroke="#bbc8d4" stroke-width="2"/><text x="1090" y="520" font-size="21" font-weight="700" fill="#1b2838" text-anchor="start">GDDR7</text><text x="1090" y="561" font-size="18" font-weight="400" fill="#1b2838" text-anchor="start">GPU 외부의 메모리</text><path d="M336,550 L384,550" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M676,550 L724,550" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M1016,550 L1064,550" fill="none" stroke="#526b82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="50" y="686" width="1300" height="110" rx="8" fill="#faf8ee" stroke="#d1c9aa" stroke-width="2"/><text x="74" y="727" font-size="23" font-weight="600" fill="#1b2838" text-anchor="start">전체 GB202의 구성과 판매 제품에서 활성화된 구성은 구분합니다.</text><text x="74" y="767" font-size="21" font-weight="400" fill="#1b2838" text-anchor="start">예: RTX 5090의 L2 캐시는 96 MB입니다. 이 그림의 128 MB는 전체 GB202 기준입니다.</text><text x="50" y="846" font-size="18" font-weight="400" fill="#536878" text-anchor="start">구성 수치: NVIDIA RTX Blackwell GPU Architecture v1.1, pp. 8–10 · 블록 위치와 크기는 물리 배치가 아닙니다.</text></g></svg>
