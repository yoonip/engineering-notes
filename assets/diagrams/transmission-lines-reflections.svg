<svg role="img" aria-label="transmission-lines-reflections" xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410"><title>전송선 왕복 / Transmission-line round trips</title><desc>Source and Load messages ordered in time from top to bottom.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#344e71"/></marker></defs><rect width="900" height="410" fill="white"/><g font-family="Malgun Gothic, sans-serif" font-size="19" fill="#172b45"><rect x="115" y="28" width="150" height="48" rx="8" fill="#edf5ff" stroke="#2563a3"/><text x="190" y="59" text-anchor="middle">Source</text><path d="M190,76 V380" stroke="#8292a6" stroke-dasharray="6 5"/><rect x="635" y="28" width="150" height="48" rx="8" fill="#edf5ff" stroke="#2563a3"/><text x="710" y="59" text-anchor="middle">Load</text><path d="M710,76 V380" stroke="#8292a6" stroke-dasharray="6 5"/><text x="450" y="130" text-anchor="middle" font-size="18">a0, arrival td</text><path d="M190,145 H710" stroke="#344e71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="450" y="220" text-anchor="middle" font-size="18">GammaL a0, arrival 2td</text><path d="M710,235 H190" stroke="#344e71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="450" y="310" text-anchor="middle" font-size="18">GammaS GammaL a0, arrival 3td</text><path d="M190,325 H710" stroke="#344e71" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="25" y="383" font-size="15">시간 ↓ / Time</text></g></svg>
