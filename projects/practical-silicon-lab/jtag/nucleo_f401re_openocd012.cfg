# OpenOCD v0.12.0 official scripts: native Arm DAP ST-LINK driver.
# Do not mix these transport names with current-master scripts.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32f4x.cfg]
# CN2 jumpers on, onboard ST-LINK connected to MCU NRST.
reset_config srst_only srst_nogate
adapter speed 1000
# reset-start in target/stm32f4x.cfg sets 2000 kHz; override if diagnosing.
stm32f4x.cpu configure -event reset-start { adapter speed 1000 }
# Bind the debug services to this machine only.
bindto 127.0.0.1
