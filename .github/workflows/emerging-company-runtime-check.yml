name: 기업 조사 공개 모델 실행 검사
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-inference:
    if: github.repository == 'yoonip/engineering-notes'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: .github/emerging-companies
      - name: 공개 모델·런타임 해시 확인과 기동
        run: python3 .github/emerging-companies/prepare_runtime.py --cache-dir "$RUNNER_TEMP/company-runtime" --serve
      - name: 실제 CPU 추론과 JSON 응답 검사
        run: python3 .github/emerging-companies/smoke_runtime.py
      - name: 실제 원문 후보 한 건의 제안 형식 확인
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, '.github/emerging-companies')
          from llm_research import propose_candidates
          state=json.loads(Path('.github/emerging-companies/state.json').read_text(encoding='utf-8'))
          discovered=sorted(state.get('source_candidates', []), key=lambda r:(r.get('first_seen_on',''),r['url']), reverse=True)
          proposals,errors=propose_candidates(discovered[:1], set(), limit=1)
          print(json.dumps({'proposals':proposals,'errors':errors}, ensure_ascii=False))
          if not proposals:
              raise SystemExit('The source proposal probe did not produce a valid candidate')
          PY
      - name: 실패 원인 확인
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP/company-runtime/server.log" || true
