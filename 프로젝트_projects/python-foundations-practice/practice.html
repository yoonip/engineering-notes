<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 문법 연습</title>
<style>
:root{--foreground:#172333;--muted-foreground:#526170;--purple:#6841a5;color-scheme:light;}
*{box-sizing:border-box}body{margin:0;padding:32px 16px;background:#eef2f6;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:auto;padding:28px;background:white;border:1px solid #d8e0e9;border-radius:12px}
.viz-row,.viz-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.viz-row h2{margin:0}.viz-controls{margin-top:20px}
.form-label{display:block}.form-select,.form-control{padding:10px;border:1px solid #aebdcc;border-radius:6px;background:white;font:inherit}
.form-control{width:100%;max-width:100%}.form-select{margin-left:8px}.btn{padding:9px 14px;border:1px solid #aebdcc;border-radius:6px;background:#f5f7fa;color:#172333;font:inherit;cursor:pointer}.btn:hover{background:#e8edf4}.btn-primary{background:#214e83;color:white;border-color:#214e83}
.text-small{font-size:.9rem;color:var(--muted-foreground)}.tabular-nums{font-variant-numeric:tabular-nums}.viz-badge{padding:3px 10px;border-radius:5px;background:#e9eff7}
hr{border:0;border-top:1px solid #d8e0e9;margin:24px 0}pre{background:#f4f6f9;padding:16px;border-radius:6px}code{font-family:ui-monospace,Consolas,monospace}
#pp-feedback,#pp-help,#pp-summary{padding:4px 0}#pp-answer:focus,.btn:focus{outline:3px solid #84b8ef;outline-offset:2px}
@media(max-width:560px){body{padding:12px 8px}main{padding:18px 14px}.form-select{display:block;margin:6px 0 0;width:100%}}
</style>
</head>
<body><main>
<div id="python-practice">
  <div class="viz-row"><h2>파이썬 손에 익히기</h2><span id="pp-progress" class="text-small tabular-nums"></span></div>
  <div class="viz-controls">
    <label class="form-label" for="pp-stage">연습 단계
      <select id="pp-stage" class="form-select">
        <option value="1">1 · 리스트 — append, pop, 정렬</option>
        <option value="2">2 · 문자열 · 기본 함수 · 딕셔너리</option>
        <option value="3">3 · for, range, if</option>
        <option value="4">4 · import와 도구 사용</option>
        <option value="5">5 · 섞어서 한 줄 작성</option>
      </select>
    </label>
    <button id="pp-review" class="btn" type="button">복습할 문제</button>
  </div>
  <hr>
  <div class="viz-row"><span id="pp-number" class="text-small"></span><span id="pp-topic" class="viz-badge"></span></div>
  <h3 id="pp-prompt"></h3>
  <pre id="pp-code" aria-label="문제 코드"></pre>
  <div class="viz-row"><span>완성 후 result:</span><code id="pp-expected"></code></div>
  <div id="pp-form">
    <label class="form-label" for="pp-answer">____에 들어갈 코드</label>
    <input id="pp-answer" class="form-control" type="text" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="pp-input-note">
    <div id="pp-input-note" class="text-small">빈칸 부분만 입력 · Enter로 확인 · 문법 연습용 정답 대조</div>
    <div class="viz-row pp-actions">
      <button id="pp-check" class="btn btn-primary" type="button">답 확인</button>
      <button id="pp-hint" class="btn" type="button">힌트</button>
      <button id="pp-reveal" class="btn" type="button">정답과 설명</button>
      <button id="pp-next" class="btn" type="button">다음 문제 →</button>
    </div>
  </div>
  <div id="pp-feedback" aria-live="polite"></div>
  <div id="pp-help" hidden></div>
  <pre id="pp-complete" aria-label="완성 코드" hidden></pre>
  <div id="pp-summary" hidden aria-live="polite"></div>
  <div class="text-small pp-footer">혼자 맞힌 문제와 힌트·정답을 본 문제는 따로 기록돼요. 복습에서는 답을 가리고 다시 풀어요.</div>
</div>
<style>
#python-practice { color:var(--foreground); }
#python-practice pre { white-space:pre-wrap; overflow-wrap:anywhere; font-family:ui-monospace,Consolas,monospace; margin:16px 0; }
#python-practice .pp-actions { margin-top:12px; }
#python-practice #pp-form { margin-top:16px; }
#python-practice #pp-feedback,#python-practice #pp-help { margin-top:12px; }
#python-practice .pp-footer { margin-top:20px; color:var(--muted-foreground); }
#python-practice h3 { margin:14px 0 8px; }
#python-practice .pp-keyword { color:var(--purple); }
#python-practice .pp-comment { color:var(--muted-foreground); }
#python-practice #pp-answer { font-family:ui-monospace,Consolas,monospace; }
</style>

    "explain": "counts = Counter(names)야. counts라는 변수와 Counter라는 도구의 역할을 구분해 봐.",
    "expected": 2
  },
  {
    "id": 50,
    "stage": 5,
    "topic": "한 줄 · 큐 꺼내기",
    "prompt": "큐 맨 앞의 숫자를 꺼내 result에 저장하자.",
    "code": "from collections import deque  # 큐 도구를 가져옴\nqueue = deque([4, 8, 12])  # 큐를 만듦\n____  # 맨 앞의 숫자를 꺼내 result에 저장",
    "answers": [
      "result = queue.popleft()"
    ],
    "hint": "앞에서 꺼내는 도구는 popleft()야. 결과를 result에 대입해.",
    "explain": "result = queue.popleft()야. result는 4, 남은 queue는 deque([8, 12])가 돼.",
    "expected": 4
  }
]
</script>
<script>
(() => {
  const root=document.getElementById('python-practice');
  const $=id=>root.querySelector('#'+id);
  const bank=JSON.parse(document.getElementById('pp-bank').textContent);
  const get=id=>bank.find(q=>q.id===id);
  const idsFor=stage=>bank.filter(q=>q.stage===stage).map(q=>q.id);
  let state={version:1,revision:0,stage:1,ids:idsFor(1),index:0,records:{},review:false};
  let helped=false,failed=false,draft='';
  const current=()=>get(state.ids[state.index]);
  function save(){
    state.revision=Math.max(Date.now(),state.revision+1);
  }
  function repr(value){
    if(value===true)return 'True';if(value===false)return 'False';if(value===null)return 'None';
    if(Array.isArray(value))return '['+value.map(repr).join(', ')+']';
    return typeof value==='string'?JSON.stringify(value):String(value);
  }
  // 토큰 사이 공백과 문자열 따옴표만 정규화한다. 문자열 안의 공백과 대소문자는 유지한다.
  function tokens(source){
    let out=[],i=0;
    while(i<source.length){
      const ch=source[i];
      if(/\s/.test(ch)){i++;continue;}
      if(ch==='"'||ch==="'"){
        const quote=ch;let value='',closed=false;i++;
        while(i<source.length){
          const c=source[i++];
          if(c===quote){closed=true;break;}
          if(c==='\\'&&i<source.length){const n=source[i++];value+=n==='n'?'\n':n==='t'?'\t':n==='r'?'\r':n;}
          else value+=c;
        }
        if(!closed)return null;
        out.push(['string',value]);continue;
      }
      const match=source.slice(i).match(/^(?:[A-Za-z_][A-Za-z_0-9]*|\d+(?:\.\d+)?|==|!=|<=|>=|\+=|-=|\*=|\/=|\/\/|\*\*)/);
      if(match){out.push(['token',match[0]]);i+=match[0].length;}else{out.push(['token',ch]);i++;}
    }
    return JSON.stringify(out);
  }
  function stats(){
    const done=bank.filter(q=>state.records[q.id]==='correct').length;
    const reviews=bank.filter(q=>['help','wrong'].includes(state.records[q.id])).length;
    $('pp-progress').textContent='혼자 맞힘 '+done+'/50 · 복습 '+reviews;
  }
  function render(){
    helped=false;failed=false;draft='';
    const q=current();
    $('pp-stage').value=String(q.stage);
    $('pp-number').textContent=(state.review?'복습 ':'단계 '+state.stage+' · ')+(state.index+1)+' / '+state.ids.length;
    $('pp-topic').textContent=q.topic;
    $('pp-prompt').textContent=q.prompt;
    $('pp-code').textContent=q.code;
    $('pp-expected').textContent=repr(q.expected);
    $('pp-answer').value='';
    $('pp-feedback').textContent='';
    $('pp-help').hidden=true;
    $('pp-complete').hidden=true;
    $('pp-summary').hidden=true;
    $('pp-next').textContent=state.index===state.ids.length-1?'이번 묶음 마치기':'다음 문제 →';
    stats();
  }
  function disclose(full){
    const q=current();helped=true;
    if(state.records[q.id]!=='correct')state.records[q.id]='help';
    $('pp-help').hidden=false;
    $('pp-help').textContent=full?q.explain:q.hint;
    if(full){$('pp-complete').hidden=false;$('pp-complete').textContent=q.code.replace('____',q.answers[0]);}
    stats();save();
  }
  function checkAnswer(event){
    event.preventDefault();const q=current();draft=$('pp-answer').value;
    if(!draft.trim()){$('pp-feedback').textContent='빈칸에 들어갈 코드를 먼저 입력해 줘.';return;}
    const actual=tokens(draft),ok=actual!==null&&q.answers.some(a=>tokens(a)===actual);
    if(ok){
      const clean=!helped&&!failed;
      if(clean||state.records[q.id]!=='correct')state.records[q.id]=clean?'correct':'help';
      $('pp-feedback').textContent=clean?'맞았어! 혼자 맞힌 문제로 기록했어.':'맞았어. 복습할 문제에서 답을 가리고 한 번 더 풀어 봐.';
      $('pp-help').hidden=false;$('pp-help').textContent=q.explain;
      $('pp-complete').hidden=false;$('pp-complete').textContent=q.code.replace('____',draft.trim());
    }else{
      failed=true;if(state.records[q.id]!=='correct')state.records[q.id]='wrong';
      let detail='철자, 대소문자, 괄호와 콜론을 확인해 봐. 다른 풀이가 가능해도 이 연습에서 요청한 형태로 작성해 줘.';
      if(draft.includes('appned'))detail='appned가 아니라 append야. n과 e의 위치를 확인해 봐.';
      else if(q.answers[0].startsWith('for ')&&!draft.trim().endsWith(':'))detail='for문 마지막에 콜론(:)이 필요해.';
      else if(q.answers[0].startsWith('if ')&&!draft.trim().endsWith(':'))detail='if문 마지막에 콜론(:)이 필요해.';
      $('pp-feedback').textContent='아직 이 연습의 정답과 달라. '+detail;
    }
    stats();save();
  }
  $('pp-check').addEventListener('click',checkAnswer);
  $('pp-answer').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing)checkAnswer(event);});
  $('pp-hint').addEventListener('click',()=>disclose(false));
  $('pp-reveal').addEventListener('click',()=>disclose(true));
  $('pp-next').addEventListener('click',()=>{
    if(!state.records[current().id])state.records[current().id]='wrong';
    if(state.index+1<state.ids.length){state.index++;render();save();$('pp-answer').focus();return;}
    const clean=state.ids.filter(id=>state.records[id]==='correct').length;
    $('pp-summary').hidden=false;
    $('pp-summary').textContent='이번 묶음 '+state.ids.length+'문제 중 혼자 맞힘 '+clean+'개. 위에서 다음 단계를 고르거나, 복습할 문제를 눌러 다시 풀어 봐.';
    stats();save();
  });
  $('pp-stage').addEventListener('change',()=>{state.stage=Number($('pp-stage').value);state.ids=idsFor(state.stage);state.index=0;state.review=false;render();save();});
  $('pp-review').addEventListener('click',()=>{
    const ids=bank.filter(q=>['help','wrong'].includes(state.records[q.id])).map(q=>q.id);
    if(!ids.length){$('pp-feedback').textContent='아직 복습할 문제가 없어. 힌트·정답을 보거나 틀린 문제가 여기에 모여.';return;}
    state.ids=ids;state.index=0;state.review=true;render();save();
  });
  render();
  window.__pythonPracticeTest={tokens,bank};
})();
</script>

</main></body></html>
