<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="385" viewBox="0 0 1160 385" role="img"><title>음의 피드백: 오차에서 입력을 계산하기 / Negative feedback: compute the input from the error</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#315f78"/></marker></defs><rect width="1160" height="385" fill="white"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#252c33;font-size:16px}.en{font-size:13px;fill:#596570}.wire{stroke:#252c33;stroke-width:1.8;fill:none}.guide{stroke:#596570;stroke-width:1.2;fill:none;stroke-dasharray:5 4}.flow{stroke:#315f78;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><text x="32" y="30" font-weight="600">음의 피드백: 오차에서 입력을 계산하기</text><text x="32" y="51" class="en">Negative feedback: compute the input from the error</text><path d="M32,67 H1128" stroke="#d8dde1"/><text x="45" y="181" >r[k]</text><path d="M95,176 L161,176" class="flow"/><circle cx="184" cy="176" r="23" class="wire"/><text x="169" y="168" >+</text><text x="168" y="206" >−</text><path d="M207,176 L285,176" class="flow"/><text x="242" y="155" class="en" text-anchor="middle">e[k]</text><rect x="285" y="135" width="150" height="83" fill="white" stroke="#596570" stroke-width="1.1"/><text x="360" y="167" text-anchor="middle">비례 제어 K</text><text x="360" y="191" text-anchor="middle" class="en">P controller</text><rect x="500" y="135" width="165" height="83" fill="white" stroke="#596570" stroke-width="1.1"/><text x="582.5" y="167" text-anchor="middle">입력 유지</text><text x="582.5" y="191" text-anchor="middle" class="en">Zero-order hold</text><rect x="730" y="135" width="175" height="83" fill="white" stroke="#596570" stroke-width="1.1"/><text x="817.5" y="167" text-anchor="middle">대상 시스템</text><text x="817.5" y="191" text-anchor="middle" class="en">Plant</text><path d="M435,176 L500,176" class="flow"/><path d="M665,176 L730,176" class="flow"/><path d="M905,176 L1060,176" class="flow"/><text x="1068" y="181" >y(t)</text><circle cx="988" cy="176" r="3" fill="#252c33"/><path d="M988,176 V295 H680" class="flow"/><path d="M500,295 H184 V199" class="flow"/><rect x="500" y="269" width="180" height="52" fill="white" stroke="#596570" stroke-width="1.1"/><text x="590" y="291" text-anchor="middle">표본화</text><text x="590" y="312" text-anchor="middle" class="en">Sample at kTs</text><text x="338" y="317" class="en">y[k]</text><text x="32" y="366" class="en">e[k] = r[k] − y[k]     ·     입력 유지와 샘플링을 포함한 모델은 본문의 식을 따른다.</text></svg>
