<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="410" viewBox="0 0 1050 410" role="img"><title>전송선 왕복 반사의 도착 순서 / Arrival order of incident and reflected waves</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#315f78"/></marker></defs><rect width="1050" height="410" fill="white"/><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#252c33;font-size:16px}.en{font-size:13px;fill:#596570}.wire{stroke:#252c33;stroke-width:1.8;fill:none}.guide{stroke:#596570;stroke-width:1.2;fill:none;stroke-dasharray:5 4}.flow{stroke:#315f78;stroke-width:1.5;fill:none;marker-end:url(#arrow)}</style><text x="32" y="30" font-weight="600">전송선 왕복 반사의 도착 순서</text><text x="32" y="51" class="en">Arrival order of incident and reflected waves</text><path d="M32,67 H1018" stroke="#d8dde1"/><rect x="112" y="88" width="156" height="47" fill="white" stroke="#596570" stroke-width="1.1"/><text x="190" y="117" text-anchor="middle">송신원 / Source</text><path d="M190,135 L190,376" class="guide"/><rect x="772" y="88" width="156" height="47" fill="white" stroke="#596570" stroke-width="1.1"/><text x="850" y="117" text-anchor="middle">부하 / Load</text><path d="M850,135 L850,376" class="guide"/><path d="M190,192 L850,192" class="flow"/><text x="520" y="178" text-anchor="middle" class="en">a0, arrival td</text><path d="M850,270 L190,270" class="flow"/><text x="520" y="256" text-anchor="middle" class="en">GammaL a0, arrival 2td</text><path d="M190,348 L850,348" class="flow"/><text x="520" y="334" text-anchor="middle" class="en">GammaS GammaL a0, arrival 3td</text><text x="35" y="384" class="en">시간 / Time ↓</text></svg>
