<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">⑦ 웨이퍼 검사: 형상과 전기적 판정을 구분합니다</title><desc id="desc">완성된 die의 pad에 접촉해 검사하는 개념입니다. 결과를 die 좌표와 연결합니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">⑦ 웨이퍼 검사: 형상과 전기적 판정을 구분합니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">완성된 die의 pad에 접촉해 검사하는 개념입니다. 결과를 die 좌표와 연결합니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si</text><rect x="280" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">절연막</text><rect x="518" y="104" width="18" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">pad·배선</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 검사 전의 완성 die</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="130" width="470" height="47" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="105" y="154" width="370" height="8" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="274" y="123" width="32" height="31" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="238" y="114" width="104" height="12" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="290" y="198" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">완성 die · 내부 구조 생략</text><text x="290" y="94" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">노출된 pad</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">표면의 pad를 통해 회로에 접근합니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. probe로 전기적 검사</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="130" width="470" height="47" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="105" y="154" width="370" height="8" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="274" y="123" width="32" height="31" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="238" y="114" width="104" height="12" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="290" y="198" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">완성 die · 내부 구조 생략</text><path d="M120 58 L230 85 L256 112" fill="none" stroke="#596d80" stroke-width="6"/><text x="290" y="80" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">probe 접촉</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">설계 단면을 새 구조로 만드는 공정은 아닙니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 검사 결과를 맵에 기록</text><circle cx="205" c