roke-width="0.8" /><rect x="254" y="156" width="23" height="23" fill="#86c6a2" stroke="#6f8798" stroke-width="0.8" /><rect x="334" y="87" width="20" height="18" fill="#86c6a2" stroke="#24394b" stroke-width="1.3" /><text x="365" y="103" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">통과</text><rect x="334" y="125" width="20" height="18" fill="#e6a29b" stroke="#24394b" stroke-width="1.3" /><text x="365" y="141" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">실패</text><text x="331" y="184" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">가상의 판정 맵</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">좌표·조건·최초 결과와 재검사를 함께 남깁니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f4f8f5" stroke="#c6d4ce" stroke-width="1.3" rx="10"/><text x="22" y="35" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">접촉과 제품 결함의 구분</text><text x="22" y="79" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">probe 자국이나 접촉 오염이 생길 수 있습니다.</text><text x="22" y="114" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">접촉 실패와 die의 실제 고장을 분리합니다.</text><text x="22" y="149" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">맵은 단면 사진이 아니라 위치별 판정입니다.</text><text x="22" y="184" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">표의 통과·실패는 실측 데이터가 아닙니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
