<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">④ 식각: 열린 부분의 대상막을 제거합니다</title><desc id="desc">마스크가 남기는 선과 여는 공간을 구분한 이방성 식각의 개념 예입니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">④ 식각: 열린 부분의 대상막을 제거합니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">마스크가 남기는 선과 여는 공간을 구분한 이방성 식각의 개념 예입니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si 기판</text><rect x="280" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">대상막</text><rect x="518" y="104" width="18" height="17" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">PR 마스크</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 식각 전: PR 창</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="149" width="470" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="116" width="150" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="116" width="150" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">창 아래에는 아직 대상막이 있습니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 대상막 식각 후</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="149" width="150" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="149" width="150" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="116" width="150" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="116" width="150" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">대상막은 열리고 PR 마스크는 남은 상태입니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. PR 마스크 제거 후</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="149" width="150" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="149" width="150" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">잔막·기판 손실·옆면 형상을 확인합니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f4f8f5" stroke="#c6d4ce" stroke-width="1.3" rx="10"/><text x="22" y="35" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">불량을 구분하는 단면 정보</text><text x="22" y="79" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">짧은 식각: 창 바닥에 잔막이 남을 수 있습니다.</text><text x="22" y="114" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">과식각: 바닥층 손실이 커질 수 있습니다.</text><text x="22" y="149" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">옆 방향 제거: 남는 선폭과 창 폭이 달라집니다.</text><text x="22" y="184" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">마스크 손실과 재료 선택비도 함께 봅니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
