<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">⑥ 금속배선: 홈을 채우고 윗면을 평탄화합니다</title><desc id="desc">구리 다마신의 개념 예입니다. via와 수평 배선, 기존 하부 배선의 연결을 함께 봅니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">⑥ 금속배선: 홈을 채우고 윗면을 평탄화합니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">구리 다마신의 개념 예입니다. via와 수평 배선, 기존 하부 배선의 연결을 함께 봅니다.</text><rect x="42" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">절연막</text><rect x="280" y="104" width="18" height="17" fill="#ad8ac4" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">배리어</text><rect x="518" y="104" width="18" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">구리·시드</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 절연막의 홈·via 형성</text><rect x="55" y="100" width="470" height="111" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="100" y="195" width="380" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><path d="M155 100 H425 V145 H315 V195 H265 V145 H155 Z" fill="white" stroke="#24394b" stroke-width="1.4"/><text x="290" y="207" font-size="14" text-anchor="middle" font-weight="400" fill="#24394b">하부 배선</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">아래 배선까지 이어지는 열린 공간입니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 배리어·시드 형성</text><rect x="55" y="100" width="470" height="111" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="100" y="195" width="380" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><path d="M155 100 H425 V145 H315 V195 H265 V145 H155 Z" fill="white" stroke="#24394b" stroke-width="1.4"/><path d="M55 99 H155 V145 H265 V195 H315 V145 H425 V99 H525" fill="none" stroke="#ad8ac4" stroke-width="6"/><path d="M55 95 H159 V141 H269 V191 H311 V141 H421 V95 H525" fill="none" stroke="#db8551" stroke-width="2"/><text x="290" y="207" font-size="14" text-anchor="middle" font-weight="400" fill="#24394b">하부 배선</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">서로 다른 역할의 얇은 막을 먼저 형성합니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 구리 채움과 과충전</text><rect x="55" y="100" width="470" height="111" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="100" y="195" width="380" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><path d="M155 100 H425 V145 H315 V195 H265 V145 H155 Z" fill="white" stroke="#24394b" stroke-width="1.4"/><path d="M155 100 H425 V145 H315 V195 H265 V145 H155 Z" fill="#db8551" stroke="#24394b" stroke-width="1.4"/><path d="M55 99 H155 V145 H265 V195 H315 V145 H425 V99 H525" fill="none" stroke="#ad8ac4" stroke-width="6"/><rect x="55" y="80" width="470" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="290" y="207" font-size="14" text-anchor="middle" font-weight="400" fill="#24394b">하부 배선</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">홈 밖 윗면에도 구리가 남아 있습니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">D. CMP로 과충전 제거</text><rect x="55" y="100" width="470" height="111" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="100" y="195" width="380" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><path d="M155 100 H425 V145 H315 V195 H265 V145 H155 Z" fill="white" stroke="#24394b" stroke-width="1.4"/><path d="M155 100 H425 V145 H315 V195 H265 V145 H155 Z" fill="#db8551" stroke="#24394b" stroke-width="1.4"/><path d="M55 99 H155 V145 H265 V195 H315 V145 H425 V99 H525" fill="none" stroke="#ad8ac4" stroke-width="6"/><rect x="52" y="72" width="476" height="28" fill="#f8fafc" stroke="none" stroke-width="1.3" /><path d="M55 100 L525 100" fill="none" stroke="#53697b" stroke-width="1.3"/><text x="290" y="207" font-size="14" text-anchor="middle" font-weight="400" fill="#24394b">하부 배선</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">홈 속 금속을 남기고 층 사이를 절연합니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
