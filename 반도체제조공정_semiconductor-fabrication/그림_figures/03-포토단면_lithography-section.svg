<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">③ 포토: 감광막에 창을 만듭니다</title><desc id="desc">양성 감광막의 예입니다. 노광·현상과 아래 재료의 식각은 다른 작업입니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">③ 포토: 감광막에 창을 만듭니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">양성 감광막의 예입니다. 노광·현상과 아래 재료의 식각은 다른 작업입니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si 기판</text><rect x="280" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">대상막</text><rect x="518" y="104" width="18" height="17" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">감광막 PR</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 대상막 위에 PR 도포</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="149" width="470" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="116" width="470" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">대상막과 감광막은 다른 재료입니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 마스크 패턴으로 노광</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="149" width="470" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="116" width="470" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="65" width="150" height="14" fill="#536477" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="65" width="150" height="14" fill="#536477" stroke="#24394b" stroke-width="1.3" /><path d="M237 80 L237 112" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><path d="M289 80 L289 112" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><path d="M341 80 L341 112" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="116" width="170" height="33" fill="#fff0bd" stroke="none" stroke-width="1.3" opacity=".6"/><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">빛에 반응해도 이 단계에서는 PR이 남아 있습니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 현상으로 PR의 창 형성</text><rect x="55" y="177" width="470" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="149" width="470" height="28" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="116" width="150" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="116" width="150" height="33" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">창 아래의 대상막은 아직 제거하지 않았습니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f4f8f5" stroke="#c6d4ce" stroke-width="1.3" rx="10"/><text x="22" y="35" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">다음 식각으로 넘길 조건</text><text x="22" y="79" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">양성·음성 PR은 남는 부분이 다릅니다.</text><text x="22" y="114" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">CD와 층 사이 overlay를 따로 확인합니다.</text><text x="22" y="149" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">잔류 PR·초점·현상 상태가 전사에 영향을 줍니다.</text><text x="22" y="184" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">광학계·마스크는 원리를 위해 단순화했습니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
