    <rect x="285" y="108" width="10" height="204" fill="#edf2f6" stroke="none" stroke-width="1.2" />
    <rect x="280" y="91" width="20" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="180" y="83" width="220" height="8" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="240" y="312" width="100" height="16" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <text x="355" y="326" font-size="15" text-anchor="start" font-weight="400">공통 source</text>
    <text x="410" y="110" font-size="15" text-anchor="middle" font-weight="400">bit line</text>
    <text x="88" y="175" font-size="15" text-anchor="start" font-weight="400">word line</text>
    <text x="390" y="298" font-size="14" text-anchor="middle" font-weight="400">중앙: 채널·내부 충전재</text>
    <text x="290" y="362" font-size="17" text-anchor="middle" font-weight="400">게이트와 채널 사이에 절연·전하 저장막이 있습니다.</text>
    <text x="290" y="392" font-size="16" text-anchor="middle" font-weight="400">층별 접촉·계단·선택 소자는 생략했습니다.</text>
  </g>
  <g transform="translate(660 145)">
    <rect x="0" y="0" width="580" height="430" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.2" rx="10" />
    <text x="22" y="36" font-size="22" text-anchor="start" font-weight="700">HBM · 제조한 DRAM die의 접합</text>
    <text x="22" y="70" font-size="17" text-anchor="start" font-weight="400">메모리 die 세 장과 실리콘 인터포저를 가정한 예입니다.</text>
    <rect x="90" y="110" width="200" height="30" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
