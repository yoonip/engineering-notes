    <rect x="150" y="206" width="10" height="4" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="90" y="210" width="200" height="30" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <rect x="148" y="210" width="14" height="30" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="150" y="210" width="10" height="30" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="150" y="240" width="10" height="4" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <circle cx="155" cy="250" r="6" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="150" y="256" width="10" height="4" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="90" y="260" width="200" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <rect x="148" y="260" width="14" height="35" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="150" y="260" width="10" height="35" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <text x="205" y="284" font-size="17" text-anchor="middle" font-weight="400">base die</text>
    <rect x="390" y="260" width="110" height="35" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <text x="445" y="284" font-size="17" text-anchor="middle" font-weight="400">로직</text>
    <rect x="50" y="345" width="470" height="30" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <rect x="50" y="345" width="470" height="18" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="150" y="295" width="10" height="62" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="410" y="295" width="10" height="62" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <path d="M155 357 L415 357" fill="none" stroke="#db8551" stroke-width="1.8" />
    <text x="390" y="130" font-size="17" text-anchor="start" font-weight="400">DRAM die</text>
    <text x="390" y="165" font-size="16" text-anchor="start" font-weight="400">TSV: die 내부</text>
    <text x="390" y="200" font-size="16" text-anchor="start" font-weight="400">접합부: die 사이</text>
    <text x="285" y="392" font-size="16" text-anchor="middle" font-weight="400">실리콘 인터포저를 통해 옆의 로직과 연결합니다.</text>
    <text x="285" y="419" font-size="15" text-anchor="middle" font-weight="400">대표 접속 경로 하나만 표시했습니다. 내부 회로는 생략했습니다.</text>
  </g>
  <text x="40" y="620" font-size="16" text-anchor="start" font-weight="400">자체 개념도 · 실제 축척 아님 · NAND의 word line 층수와 HBM의 메모리 die 수는 다른 개수입니다.</text>
  <text x="40" y="650" font-size="16" text-anchor="start" font-weight="400">색은 실제 재료 색이 아닌 역할 구분입니다. 공식 구조 그림과 자세한 공정 분기는 연결한 본문에서 확인합니다.</text>
</svg>
