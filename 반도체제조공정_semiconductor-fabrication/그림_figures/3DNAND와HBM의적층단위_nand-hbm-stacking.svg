<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">3D NAND와 HBM은 쌓는 대상이 다릅니다</title>
  <desc id="desc">NAND의 셀 층·수직 채널과 HBM의 DRAM die·TSV를 구분합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#416b99" />
    </marker>
  </defs>
  <style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#24394b;}</style>
  <rect x="0" y="0" width="1280" height="690" fill="white" stroke="none" stroke-width="1.2" />
  <text x="40" y="46" font-size="28" text-anchor="start" font-weight="700">3D NAND와 HBM은 쌓는 대상이 다릅니다</text>
  <text x="40" y="80" font-size="18" text-anchor="start" font-weight="400">NAND의 셀 층·수직 채널과 HBM의 DRAM die·TSV를 구분합니다.</text>
  <rect x="45" y="101" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
  <text x="73" y="116" font-size="16" text-anchor="start" font-weight="400">Si</text>
  <rect x="283" y="101" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
  <text x="311" y="116" font-size="16" text-anchor="start" font-weight="400">절연막</text>
  <rect x="521" y="101" width="18" height="17" fill="#86c6a2" stroke="#24394b" stroke-width="1.2" />
  <text x="549" y="116" font-size="16" text-anchor="start" font-weight="400">전하 저장막</text>
  <rect x="759" y="101" width="18" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
  <text x="787" y="116" font-size="16" text-anchor="start" font-weight="400">도체·접속</text>
  <g transform="translate(40 145)">
    <rect x="0" y="0" width="580" height="430" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.2" rx="10" />
    <text x="22" y="36" font-size="22" text-anchor="start" font-weight="700">3D NAND · 한 웨이퍼 안의 셀 층</text>
    <text x="22" y="70" font-size="17" text-anchor="start" font-weight="400">수직 채널과 층별 word line을 옆에서 본 개념입니다.</text>
    <rect x="70" y="130" width="190" height="24" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="320" y="130" width="190" height="24" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
