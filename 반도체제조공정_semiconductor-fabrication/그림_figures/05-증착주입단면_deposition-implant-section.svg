<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">⑤ 증착과 이온주입: 막 형성과 특성 조절</title><desc id="desc">A→B는 증착, C→D는 별도의 주입·열처리 예입니다. 한 소자의 연속 순서가 아닙니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">⑤ 증착과 이온주입: 막 형성과 특성 조절</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">A→B는 증착, C→D는 별도의 주입·열처리 예입니다. 한 소자의 연속 순서가 아닙니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si 기판</text><rect x="280" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">증착한 막</text><rect x="518" y="104" width="18" height="17" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">주입 마스크</text><rect x="756" y="104" width="18" height="17" fill="#86c6a2" stroke="#24394b" stroke-width="1.3" /><text x="784" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">활성화 영역</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 증착 전의 열린 트렌치</text><path d="M55 104 H207 V196 H373 V104 H525 V212 H55 Z" fill="#bdc8d3" stroke="#24394b" stroke-width="1.4"/><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">안쪽 면에도 필요한 막이 도달해야 합니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 컨포멀 박막 형성</text><path d="M55 104 H207 V196 H373 V104 H525 V212 H55 Z" fill="#bdc8d3" stroke="#24394b" stroke-width="1.4"/><path d="M55 101 H211 V192 H369 V101 H525" fill="none" stroke="#80bfe2" stroke-width="8"/><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">벽과 바닥을 덮으며 남는 통로가 좁아집니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 마스크 창으로 이온 주입</text><rect x="55" y="132" width="470" height="80" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="103" width="150" height="29" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><rect x="375" y="103" width="150" height="29" fill="#f1c56d" stroke="#24394b" stroke-width="1.3" /><path d="M229 65 L229 140" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><path d="M269 65 L269 140" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><path d="M309 65 L309 140" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><path d="M349 65 L349 140" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><circle cx="230" cy="149" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><circle cx="257" cy="160" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><circle cx="284" cy="146" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><circle cx="311" cy="165" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><circle cx="341" cy="151" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><circle cx="365" cy="176" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><circle cx="280" cy="181" r="3.5" fill="#567eac" stroke="#567eac" stroke-width="1.2"/><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">면적당 주입량과 깊이별 농도를 구분합니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">D. 마스크 제거 뒤 열처리</text><rect x="55" y="132" width="470" height="80" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="205" y="133" width="170" height="47" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".7"/><text x="290" y="165" font-size="18" text-anchor="middle" font-weight="400" fill="#24394b">활성화 영역</text><path d="M235 102 q-9 -9 0 -18 q9 -9 0 -18" fill="none" stroke="#bb7054" stroke-width="2"/><path d="M290 102 q-9 -9 0 -18 q9 -9 0 -18" fill="none" stroke="#bb7054" stroke-width="2"/><path d="M345 102 q-9 -9 0 -18 q9 -9 0 -18" fill="none" stroke="#bb7054" stroke-width="2"/><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">손상 회복·활성화·확산을 각각 평가합니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
