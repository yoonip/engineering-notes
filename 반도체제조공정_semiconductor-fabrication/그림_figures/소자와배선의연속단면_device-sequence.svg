<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060" role="img" aria-labelledby="title desc"><title id="title">평면형 nMOS의 소자·접촉·배선 단면 변화</title><desc id="desc">같은 소자에서 게이트 절연막, 게이트, 소스와 드레인, 층간 절연막, 접촉창, 금속 연결을 차례로 형성하는 자체 개념도입니다. 소자 분리와 스페이서, 바디 접속 등은 생략했으며 실제 공정 레시피가 아닙니다.</desc><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}</style><rect x="0" y="0" width="1280" height="1060" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">같은 소자에서 이어지는 단면 변화</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">평면형 nMOS의 개념 예 · 소자 분리·spacer·바디 접속은 생략했습니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si 기판</text><rect x="280" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">절연막</text><rect x="518" y="104" width="18" height="17" fill="#86c6a2" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">n⁺ 영역</text><rect x="756" y="104" width="18" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="784" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">접속 금속</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 산화·절연막 형성</text><rect x="55" y="136" width="470" height="76" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="445" y="194" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">p형 Si</text><rect x="55" y="130" width="470" height="6" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="290" y="111" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">얇은 게이트 절연막</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">Si 표면과 게이트 절연막의 계면을 만듭니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 게이트 패턴 형성</text><rect x="55" y="136" width="470" height="76" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="445" y="194" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">p형 Si</text><rect x="230" y="130" width="120" height="6" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="90" width="120" height="40" fill="#687d92" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">전극과 그 아래 절연막의 위치를 정합니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 소스·드레인 형성</text><rect x="55" y="136" width="470" height="76" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="445" y="194" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">p형 Si</text><rect x="230" y="130" width="120" height="6" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="90" width="120" height="40" fill="#687d92" stroke="#24394b" stroke-width="1.3" /><rect x="105" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><rect x="350" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><text x="165" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><text x="413" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">주입·열처리를 거쳐 접합 영역을 만듭니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">D. 층간 절연막·평탄화</text><rect x="55" y="136" width="470" height="76" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="445" y="194" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">p형 Si</text><rect x="55" y="70" width="470" height="66" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="130" width="120" height="6" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="90" width="120" height="40" fill="#687d92" stroke="#24394b" stroke-width="1.3" /><rect x="105" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><rect x="350" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><text x="165" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><text x="413" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">덮은 막의 표면을 다음 공정에 맞춥니다.</text></g><g transform="translate(40 705)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">E. contact 창 열기</text><rect x="55" y="136" width="470" height="76" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="445" y="194" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">p형 Si</text><rect x="55" y="70" width="470" height="66" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="130" width="120" height="6" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="90" width="120" height="40" fill="#687d92" stroke="#24394b" stroke-width="1.3" /><rect x="105" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><rect x="350" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><text x="165" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><text x="413" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><rect x="160" y="70" width="25" height="66" fill="white" stroke="#53697b" stroke-width="1" /><rect x="278" y="70" width="25" height="20" fill="white" stroke="#53697b" stroke-width="1" /><rect x="405" y="70" width="25" height="66" fill="white" stroke="#53697b" stroke-width="1" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">각 단자까지 연결될 서로 다른 깊이의 창입니다.</text></g><g transform="translate(660 705)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">F. 접촉 금속과 초기 배선</text><rect x="55" y="136" width="470" height="76" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="445" y="194" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">p형 Si</text><rect x="55" y="70" width="470" height="66" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="130" width="120" height="6" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="230" y="90" width="120" height="40" fill="#687d92" stroke="#24394b" stroke-width="1.3" /><rect x="105" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><rect x="350" y="137" width="125" height="27" fill="#86c6a2" stroke="none" stroke-width="1.3" opacity=".85"/><text x="165" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><text x="413" y="156" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">n⁺</text><rect x="160" y="70" width="25" height="66" fill="#db8551" stroke="#53697b" stroke-width="1" /><rect x="278" y="70" width="25" height="20" fill="#db8551" stroke="#53697b" stroke-width="1" /><rect x="405" y="70" width="25" height="66" fill="#db8551" stroke="#53697b" stroke-width="1" /><rect x="135" y="60" width="75" height="10" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="258" y="60" width="65" height="10" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="380" y="60" width="75" height="10" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">단자들을 분리해 배선합니다. 추가 층을 반복합니다.</text></g><text x="40" y="1004" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">자체 개념도 · 실제 축척 아님 · GAA·금속 게이트의 양산 순서와 동일한 도면이 아닙니다.</text><text x="40" y="1030" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">게이트 패터닝과 contact 형성에서도 포토·식각·세정이 반복됩니다.</text></svg>
