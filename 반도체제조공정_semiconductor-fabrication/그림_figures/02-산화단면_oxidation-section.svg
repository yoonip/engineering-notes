<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">② 열산화: 막이 자라면서 Si도 소비됩니다</title><desc id="desc">산화 전 표면을 점선으로 표시하여 계면과 윗면의 이동을 비교합니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">② 열산화: 막이 자라면서 Si도 소비됩니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">산화 전 표면을 점선으로 표시하여 계면과 윗면의 이동을 비교합니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si</text><rect x="280" y="104" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">열산화 SiO₂</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 산화 전</text><rect x="55" y="130" width="470" height="80" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="290" y="175" font-size="20" text-anchor="middle" font-weight="400" fill="#24394b">Si</text><text x="290" y="108" font-size="18" text-anchor="middle" font-weight="400" fill="#24394b">초기 표면</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">실리콘 표면이 산화 반응의 출발점입니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 열산화 후</text><rect x="55" y="152" width="470" height="58" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="55" y="102" width="470" height="50" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><path d="M48 130 L532 130" fill="none" stroke="#53697b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="290" y="87" font-size="17" text-anchor="middle" font-weight="400" fill="#24394b">점선: 원래 Si 표면</text><text x="290" y="123" font-size="18" text-anchor="middle" font-weight="400" fill="#24394b">SiO₂</text><text x="290" y="189" font-size="20" text-anchor="middle" font-weight="400" fill="#24394b">Si</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">산화막이 원래 표면 위와 아래로 형성됩니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 성장한 산화막을 제거한 예</text><rect x="55" y="152" width="470" height="58" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><path d="M48 130 L532 130" fill="none" stroke="#53697b" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M95 131 L95 150" fill="none" stroke="#416b99" stroke-width="2" marker-end="url(#arrow)"/><text x="118" y="145" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">소비된 Si</text><text x="290" y="190" font-size="20" text-anchor="middle" font-weight="400" fill="#24394b">남은 Si</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">산화막을 없애도 소비된 Si는 돌아오지 않습니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f4f8f5" stroke="#c6d4ce" stroke-width="1.3" rx="10"/><text x="22" y="35" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">단면을 읽을 때의 기준</text><text x="22" y="79" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">열산화와 외부 재료의 증착을 구별합니다.</text><text x="22" y="114" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">그림의 막 두께는 실제 제품의 비율이 아닙니다.</text><text x="22" y="149" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">게이트 계면은 두께와 결함을 함께 봅니다.</text><text x="22" y="184" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">high-k 막의 적층은 산화 장에서 비교합니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
