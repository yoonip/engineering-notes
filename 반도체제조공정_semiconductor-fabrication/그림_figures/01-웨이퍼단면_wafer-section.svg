<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">① 웨이퍼 제조: 단결정과 표면을 준비합니다</title><desc id="desc">절단·연삭·연마·세정의 관계를 단순화한 예입니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">① 웨이퍼 제조: 단결정과 표면을 준비합니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">절단·연삭·연마·세정의 관계를 단순화한 예입니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">단결정 Si</text><rect x="280" y="104" width="18" height="17" fill="#e8a5a3" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">가공 손상층</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 절단 전 단결정 잉곳</text><ellipse cx="290" cy="194" rx="95" ry="20" fill="#a7b4c2" stroke="#24394b"/><rect x="195" y="78" width="190" height="116" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><ellipse cx="290" cy="78" rx="95" ry="20" fill="#d9e1e8" stroke="#24394b"/><path d="M194 116 L386 116" fill="none" stroke="#9d5252" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M194 147 L386 147" fill="none" stroke="#9d5252" stroke-width="1.4" stroke-dasharray="6 4"/><path d="M194 178 L386 178" fill="none" stroke="#9d5252" stroke-width="1.4" stroke-dasharray="6 4"/><text x="290" y="141" font-size="19" text-anchor="middle" font-weight="400" fill="#24394b">단결정 Si</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">잉곳을 자른 뒤 소자 공정용 판을 준비합니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 절단 직후의 웨이퍼</text><rect x="55" y="126" width="470" height="62" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><path d="M55 126 L85 121 L115 127 L145 123 L175 128 L205 123 L235 127 L265 122 L295 128 L325 123 L355 127 L385 122 L415 128 L445 123 L475 127 L525 123 L525 137 L55 137 Z" fill="#e8a5a3" stroke="#ad6666" stroke-width="1.4"/><rect x="55" y="179" width="470" height="9" fill="#e8a5a3" stroke="#ad6666" stroke-width="1.3" /><text x="290" y="102" font-size="18" text-anchor="middle" font-weight="400" fill="#24394b">절단면의 거칠기·손상</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">표면 손상층과 거칠기를 제거해야 합니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 표면 가공 후의 웨이퍼</text><rect x="55" y="130" width="470" height="54" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="290" y="162" font-size="18" text-anchor="middle" font-weight="400" fill="#24394b">표면을 가공한 웨이퍼</text><path d="M55 126 L525 126" fill="none" stroke="#4e8e65" stroke-width="2"/><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">평탄도·두께·거칠기를 각각 확인합니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f4f8f5" stroke="#c6d4ce" stroke-width="1.3" rx="10"/><text x="22" y="35" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">표면과 내부는 다른 검사 대상입니다</text><text x="22" y="79" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">연마는 내부 결정 결함을 모두 없애지 않습니다.</text><text x="22" y="114" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">TTV·bow·warp·거칠기는 서로 다른 값입니다.</text><text x="22" y="149" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">막을 쌓기 전 표면 오염도 확인합니다.</text><text x="22" y="184" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">p형·n형 등 필요한 기판 성질을 선택합니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
