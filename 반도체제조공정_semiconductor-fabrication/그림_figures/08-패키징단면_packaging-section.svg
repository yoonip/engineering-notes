<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc"><title id="title">⑧ 패키징: die를 외부 기판과 연결합니다</title><desc id="desc">한 가지 flip-chip BGA의 개념 예입니다. 와이어 본딩·3D 적층은 다른 연결 방식입니다. A부터 순서대로 설명한 개념 단면이며 실제 축척과 제품 구조는 아닙니다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#416b99"/></marker></defs><style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;}svg{background:white;}</style><rect x="0" y="0" width="1280" height="780" fill="white" stroke="none" stroke-width="1.3" /><text x="40" y="47" font-size="29" text-anchor="start" font-weight="700" fill="#24394b">⑧ 패키징: die를 외부 기판과 연결합니다</text><text x="40" y="82" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">한 가지 flip-chip BGA의 개념 예입니다. 와이어 본딩·3D 적층은 다른 연결 방식입니다.</text><rect x="42" y="104" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><text x="70" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">Si die</text><rect x="280" y="104" width="18" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="308" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">금속 접속·범프</text><rect x="518" y="104" width="18" height="17" fill="#86c6a2" stroke="#24394b" stroke-width="1.3" /><text x="546" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">언더필</text><rect x="756" y="104" width="18" height="17" fill="#e6d3ad" stroke="#24394b" stroke-width="1.3" /><text x="784" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">패키지 기판</text><rect x="994" y="104" width="18" height="17" fill="#ad8ac4" stroke="#24394b" stroke-width="1.3" /><text x="1022" y="119" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">보호재</text><g transform="translate(40 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">A. 박막화·분리한 die</text><rect x="170" y="88" width="240" height="50" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="170" y="138" width="240" height="7" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="226" y="138" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="282" y="138" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="338" y="138" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="290" y="183" font-size="18" text-anchor="middle" font-weight="400" fill="#24394b">활성면·pad ↓</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">활성면을 아래로 향하게 놓은 모습입니다.</text></g><g transform="translate(660 145)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">B. 범프로 패키지 기판 접속</text><rect x="170" y="80" width="240" height="50" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="170" y="130" width="240" height="7" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="226" y="130" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="282" y="130" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="338" y="130" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="75" y="165" width="430" height="36" fill="#e6d3ad" stroke="#24394b" stroke-width="1.3" /><circle cx="236" cy="148" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="226" y="159" width="20" height="6" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="292" cy="148" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="282" y="159" width="20" height="6" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="348" cy="148" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="338" y="159" width="20" height="6" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="290" y="188" font-size="16" text-anchor="middle" font-weight="400" fill="#24394b">패키지 기판</text><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">전기 접속·정렬·접합 상태를 확인합니다.</text></g><g transform="translate(40 425)"><rect x="0" y="0" width="580" height="250" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.3" rx="10"/><text x="22" y="34" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">C. 언더필·보호·외부 단자</text><g transform="translate(0 -14)"><rect x="154" y="62" width="272" height="98" fill="#ad8ac4" stroke="#9c83b0" stroke-width="1.3" rx="9"/><rect x="166" y="137" width="248" height="22" fill="#86c6a2" stroke="none" stroke-width="1.3" /><rect x="170" y="80" width="240" height="50" fill="#bdc8d3" stroke="#24394b" stroke-width="1.3" /><rect x="170" y="130" width="240" height="7" fill="#80bfe2" stroke="#24394b" stroke-width="1.3" /><rect x="226" y="130" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="282" y="130" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="338" y="130" width="20" height="7" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><rect x="75" y="165" width="430" height="36" fill="#e6d3ad" stroke="#24394b" stroke-width="1.3" /><circle cx="236" cy="148" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="226" y="159" width="20" height="6" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="292" cy="148" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="282" y="159" width="20" height="6" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="348" cy="148" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="338" y="159" width="20" height="6" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><text x="290" y="188" font-size="16" text-anchor="middle" font-weight="400" fill="#24394b">패키지 기판</text><rect x="132" y="198" width="16" height="5" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="140" cy="211" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="232" y="198" width="16" height="5" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="240" cy="211" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="332" y="198" width="16" height="5" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="340" cy="211" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/><rect x="432" y="198" width="16" height="5" fill="#db8551" stroke="#24394b" stroke-width="1.3" /><circle cx="440" cy="211" r="11" fill="#db8551" stroke="#24394b" stroke-width="1.2"/></g><text x="22" y="232" font-size="17" text-anchor="start" font-weight="400" fill="#24394b">예시의 보호재와 외부 ball을 추가했습니다.</text></g><g transform="translate(660 425)"><rect x="0" y="0" width="580" height="250" fill="#f4f8f5" stroke="#c6d4ce" stroke-width="1.3" rx="10"/><text x="22" y="35" font-size="21" text-anchor="start" font-weight="700" fill="#24394b">구조를 선택할 때의 기준</text><text x="22" y="79" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">언더필은 die와 기판 사이의 틈을 채웁니다.</text><text x="22" y="114" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">기판은 Si 웨이퍼와 다른 패키지 부품입니다.</text><text x="22" y="149" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">void·박리·휨·접합 불량을 구분합니다.</text><text x="22" y="184" font-size="18" text-anchor="start" font-weight="400" fill="#24394b">조립 순서와 보호 구조는 제품마다 다릅니다.</text></g><text x="40" y="724" font-size="16" text-anchor="start" font-weight="400" fill="#24394b">설명용 단면 · 실제 축척 아님 · 결함과 계측의 연결은 각 공정 본문에서 확인합니다.</text><text x="40" y="750" font-size="15" text-anchor="start" font-weight="400" fill="#526879">직접 작성한 개념도 | 근거와 외부 그림의 이용 조건: 그림 출처 문서</text></svg>
