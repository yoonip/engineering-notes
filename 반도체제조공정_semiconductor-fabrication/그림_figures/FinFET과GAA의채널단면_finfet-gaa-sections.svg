<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
  <title id="title">게이트 위치의 단면: 평면형·FinFET·GAA</title>
  <desc id="desc">소스에서 드레인으로 흐르는 방향에 수직인 단면을 비교합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#416b99" />
    </marker>
  </defs>
  <style>text{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;fill:#24394b;}</style>
  <rect x="0" y="0" width="1280" height="690" fill="white" stroke="none" stroke-width="1.2" />
  <text x="40" y="46" font-size="28" text-anchor="start" font-weight="700">게이트 위치의 단면: 평면형·FinFET·GAA</text>
  <text x="40" y="80" font-size="18" text-anchor="start" font-weight="400">소스에서 드레인으로 흐르는 방향에 수직인 단면을 비교합니다.</text>
  <rect x="45" y="101" width="18" height="17" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
  <text x="73" y="116" font-size="16" text-anchor="start" font-weight="400">채널·기판 Si</text>
  <rect x="355" y="101" width="18" height="17" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
  <text x="383" y="116" font-size="16" text-anchor="start" font-weight="400">절연막: 게이트·소자 분리</text>
  <rect x="665" y="101" width="18" height="17" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
  <text x="693" y="116" font-size="16" text-anchor="start" font-weight="400">게이트 전극</text>
  <g transform="translate(40 140)">
    <rect x="0" y="0" width="380" height="435" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.2" rx="10" />
    <text x="22" y="36" font-size="22" text-anchor="start" font-weight="700">평면형 · 위쪽에서 제어</text>
    <text x="22" y="70" font-size="14" text-anchor="start" font-weight="400">게이트 위치에서 전류에 수직으로 자른 면입니다.</text>
    <rect x="55" y="230" width="270" height="80" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <rect x="55" y="220" width="270" height="10" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="100" y="180" width="180" height="40" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <text x="190" y="269" font-size="19" text-anchor="middle" font-weight="400">Si</text>
    <text x="190" y="350" font-size="17" text-anchor="middle" font-weight="400">전류는 화면 안팎으로 흐릅니다.</text>
    <text x="190" y="386" font-size="15" text-anchor="middle" font-weight="400">게이트 아래 표면 가까이에 채널이 생깁니다.</text>
  </g>
  <g transform="translate(460 140)">
    <rect x="0" y="0" width="380" height="435" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.2" rx="10" />
    <text x="22" y="36" font-size="22" text-anchor="start" font-weight="700">FinFET · 윗면과 양옆</text>
    <text x="22" y="70" font-size="14" text-anchor="start" font-weight="400">게이트 위치에서 전류에 수직으로 자른 면입니다.</text>
    <rect x="132" y="122" width="116" height="148" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="152" y="142" width="76" height="128" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="160" y="150" width="60" height="120" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <rect x="55" y="270" width="270" height="40" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <rect x="55" y="250" width="105" height="20" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="220" y="250" width="105" height="20" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <text x="190" y="205" font-size="19" text-anchor="middle" font-weight="400">fin</text>
    <text x="190" y="350" font-size="17" text-anchor="middle" font-weight="400">fin은 아래 Si에 이어져 있습니다.</text>
    <text x="190" y="386" font-size="15" text-anchor="middle" font-weight="400">옆면 높이와 폭·fin 수가 설계와 연결됩니다.</text>
  </g>
  <g transform="translate(880 140)">
    <rect x="0" y="0" width="380" height="435" fill="#f8fafc" stroke="#c6d4de" stroke-width="1.2" rx="10" />
    <text x="22" y="36" font-size="22" text-anchor="start" font-weight="700">GAA · 각 채널의 둘레</text>
    <text x="22" y="70" font-size="14" text-anchor="start" font-weight="400">게이트 위치에서 전류에 수직으로 자른 면입니다.</text>
    <rect x="95" y="135" width="190" height="165" fill="#db8551" stroke="#24394b" stroke-width="1.2" />
    <rect x="129" y="149" width="122" height="27" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" rx="5" />
    <rect x="135" y="155" width="110" height="15" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" rx="3" />
    <rect x="129" y="194" width="122" height="27" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" rx="5" />
    <rect x="135" y="200" width="110" height="15" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" rx="3" />
    <rect x="129" y="239" width="122" height="27" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" rx="5" />
    <rect x="135" y="245" width="110" height="15" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" rx="3" />
    <rect x="55" y="300" width="270" height="15" fill="#80bfe2" stroke="#24394b" stroke-width="1.2" />
    <rect x="55" y="315" width="270" height="25" fill="#bdc8d3" stroke="#24394b" stroke-width="1.2" />
    <text x="190" y="369" font-size="17" text-anchor="middle" font-weight="400">각 Si sheet의 위·아래·양옆을 감쌉니다.</text>
    <text x="190" y="402" font-size="14" text-anchor="middle" font-weight="400">소스·드레인은 화면 앞뒤에 있어 생략했습니다.</text>
  </g>
  <text x="40" y="620" font-size="16" text-anchor="start" font-weight="400">자체 개념도 · 실제 축척 아님 · 절연막과 전극은 다른 물질이며, 소자 분리·하부 절연은 단순화했습니다.</text>
  <text x="40" y="650" font-size="16" text-anchor="start" font-weight="400">여기서 쌓인 GAA sheet는 채널입니다. HBM처럼 완성한 메모리 die를 접합한 구조가 아닙니다.</text>
</svg>
